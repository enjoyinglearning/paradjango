services:
  # Web Service
  - type: web
    name: imageuploader
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "uv run gunicorn imageuploader.wsgi:application"
    healthCheckPath: /
    healthCheckTimeout: 100
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: imageuploader-db
          property: connectionString

  # PostgreSQL Database
  - type: pserv
    name: imageuploader-db
    runtime: postgres
    plan: free
    region: oregon
