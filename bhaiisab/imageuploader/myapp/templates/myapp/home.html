{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Uploader</title>
    <link rel="icon" type="image/x-icon" href="{% static 'myapp/images/dj.png' %}">
    






    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class=" py-5 text-center bg-secondary text-white">
        <h1 class="mb-3">Upload Image</h1>

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}
            <input type="submit" class="btn btn-danger mt-3" value="Upload">
        </form>
    </div>
    <div class="row">
        {% for x in image %}
        <div class="col-sm-4">
            <div class="card m-2">
                <img src="{{ x.photo.url }}" alt="" class="card-img-top" height="200px">
                <div class="card-footer">
                    <small class="text-muted">
                        {{ x.date }}
                    </small>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>


</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
